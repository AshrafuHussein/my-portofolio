<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Ashrafu Hussein</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
      body {
        background: #0f172a;
        color: #fff;
        font-family: 'Poppins', Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .container {
        max-width: 600px;
        margin: 80px auto 0 auto;
        padding: 32px 24px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        text-align: center;
      }
      .container h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
        color: #60a5fa;
      }
      .container h2 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #f472b6;
      }
      .container p {
        color: #cbd5e1;
        margin-bottom: 2rem;
      }
      .social-links {
        margin: 2rem 0 1rem 0;
      }
      .social-link {
        margin: 0 10px;
        color: #60a5fa;
        font-size: 1.5rem;
        transition: color 0.2s;
      }
      .social-link:hover {
        color: #f472b6;
      }
      .btn-home {
        display: inline-block;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        color: #fff;
        padding: 12px 32px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        margin-top: 1rem;
        transition: background 0.2s;
      }
      .btn-home:hover {
        background: linear-gradient(90deg, #a78bfa, #60a5fa);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Oops! Page Not Found</h2>
      <p>
        Sorry, the page you are looking for does not exist.<br>
        Please check the URL or return to the homepage.
      </p>
      <div class="social-links">
        <a href="https://github.com/AshrafuHussein" class="social-link" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://www.tiktok.com/@ash_lizer" class="social-link" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="#" class="social-link" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="https://www.instagram.com/ash_tek255/" class="social-link" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
      <a href="/" class="btn-home"><i class="fas fa-home"></i> Back to Home</a>
    </div>
  </body>
</html>
